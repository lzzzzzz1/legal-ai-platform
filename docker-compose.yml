services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      NO_PROXY: qdrant,localhost,127.0.0.1
      no_proxy: qdrant,localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
